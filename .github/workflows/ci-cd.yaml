name: Build & Release
on:
  push:
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - 'README*.md'
  workflow_dispatch:

jobs:
  pre_ci:
    name: Pre CI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get commit message
        id: push_commit_message
        run: |
          echo 'commit_message<<END_OF_COMMIT_MESSAGE_${{ github.sha }}' >> $GITHUB_OUTPUT
          echo "$(git log --format=%B -n 1 HEAD)" >> $GITHUB_OUTPUT
          echo 'END_OF_COMMIT_MESSAGE_${{ github.sha }}' >> $GITHUB_OUTPUT

    outputs:
      # Run CI only if NOT triggered from the main branch (assuming branch policy on main branch validated the PR) AND "[skip-ci]" is present in the commit message AND if the commit isn't a "release:"
      runCI: ${{ github.ref != 'refs/heads/main' && contains(steps.push_commit_message.outputs.commit_message, '[skip-ci]') == false && startsWith(steps.push_commit_message.outputs.commit_message, 'release:') == false }}
      # Run CD only if branch is main OR if "[run-cd]"" is present in the commit message and if the commit isn't a "release:"
      runCD: ${{ (github.ref == 'refs/heads/main' || contains(steps.push_commit_message.outputs.commit_message, '[run-cd]') == true || github.event_name == 'workflow_dispatch') && startsWith(steps.push_commit_message.outputs.commit_message, 'release:') == false }}

  ci:
    name: CI
    runs-on: ubuntu-22.04
    needs: [ pre_ci ]
    if: ${{ needs.pre_ci.outputs.runCI == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build using Docker
        run: |
          make build-with-docker

  release_version:
    name: Release Version (npm-semantic-release-action)
    needs: [ pre_ci, ci ]
    # In order to run even when the CI is skipped we must also add the `always()`
    if: ${{ always() && needs.pre_ci.outputs.runCD == 'true' }}
    permissions:
      id-token: write
      contents: read
      actions: write
      packages: write
    # NON VERIFIE : suppose que dbms_exporter (repo public) est autorise a assumer
    # npm-semantic-release-entrypoint-role via OIDC. A confirmer avec l'equipe
    # plateforme/AWS (voir SUP-24357) avant de se fier a ce job en pratique.
    uses: croesusfin/npm-semantic-release-action/.github/workflows/npm-semantic-release.yaml@main
    with:
      # main/master sont geres nativement par le workflow reutilisable ; sur les
      # autres branches (dev/*, feature/*, deja definies comme canaux prerelease
      # dans release.config.js) il faut explicitement passer preRelease: true
      # pour que le job interne de claims OIDC se declenche.
      preRelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
      dry-run: false

  cd:
    name: CD
    runs-on: ubuntu-22.04
    needs: [ pre_ci, ci, release_version ]
    # In order to run the CD even when the CI is skipped we must also add the `always()`
    if: ${{ always() && needs.pre_ci.outputs.runCD == 'true' && needs.release_version.outputs.new_version != '' }}
    env:
      RELEASED_VERSION: ${{ needs.release_version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build using Docker
        run: |
          make build-with-docker TAG_VERSION=v${{ env.RELEASED_VERSION }}

      - name: Create the dbms_exporter package
        run: |
          tar czvf dbms_exporter-${{ env.RELEASED_VERSION }}.linux-amd64.tar.gz dbms_exporter LICENSE README.md

      - name: Upload the dbms_exporter package to release Assets
        uses: softprops/action-gh-release@v1
        if: ${{ env.RELEASED_VERSION != '' }}
        with:
          tag_name: v${{ env.RELEASED_VERSION }}
          files: dbms_exporter-${{ env.RELEASED_VERSION }}.linux-amd64.tar.gz

  test-build:
    name: Test Build (manuel, sans semantic-release)
    runs-on: ubuntu-22.04
    needs: [ pre_ci ]
    # Uniquement pour un déclenchement manuel sur une branche autre que main :
    # contourne semantic-release (bloqué par l'absence de SEMANTIC_RELEASE_ACCESS_TOKEN,
    # voir SUP-24357) pour produire un binaire de test sans créer de release/tag GitHub.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build using Docker
        run: |
          make build-with-docker

      - name: Create the dbms_exporter test package
        run: |
          tar czvf dbms_exporter-test-${{ github.run_number }}.linux-amd64.tar.gz dbms_exporter LICENSE README.md

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbms_exporter-test-${{ github.run_number }}-${{ github.sha }}
          path: dbms_exporter-test-${{ github.run_number }}.linux-amd64.tar.gz
          retention-days: 14
